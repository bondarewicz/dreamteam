name: release

# Beta from any non-main branch (e.g. feat/distribution) → npm dist-tag `beta`.
# Stable from main → dist-tag `latest`. PUBLIC package so people can install it.
# No provenance though: npm only verifies provenance for PUBLIC source repos, and
# this repo is private — publishing with --provenance fails with E422. So the
# package is public + unattested while the repo stays private.
#
# VERSIONING is automated by release-please.yml: it maintains a Release PR that
# bumps package.json + CHANGELOG and creates the git tag + GitHub Release on
# merge. This workflow only PUBLISHES — when the version bump lands on main, the
# stable step below sees a new version and publishes it via OIDC. (release.yml
# stays the publisher because the npm trusted-publisher is bound to this filename.)
#
# GATE: the unit/integration suite (bun test) runs here — it's LLM-free and CI-safe.
# The BEHAVIORAL eval gate (`bun evals/src/cli.ts --trials 3`) is NOT run in CI: it
# needs Claude/Max auth that CI doesn't have, and ANTHROPIC_API_KEY would bill the API
# (the repo deliberately avoids that). Run it LOCALLY before triggering a release —
# see RELEASING.md.

on:
  push:
    branches: [main, feat/distribution]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Pack only, do not publish"
        type: boolean
        default: false

permissions:
  contents: read # release-please.yml owns tags + GitHub Releases
  id-token: write # OIDC trusted publishing to npm

jobs:
  release:
    runs-on: ubuntu-latest
    # Surface npm publishes in the repo's Deployments (beta vs latest). npm OIDC
    # trusted-publishing matches on repo + workflow file, not environment, so this
    # is additive. github-pages stays its own environment in deploy-site.yml.
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'npm-latest' || 'npm-beta' }}
      url: https://www.npmjs.com/package/@bondarewicz/dreamteam
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false # publish is via OIDC; GH Release uses GH_TOKEN env, not git creds

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Upgrade npm (OIDC trusted publishing needs npm >= 11.5)
        run: npm install -g npm@latest

      - name: Install
        run: bun install

      - name: Test gate (harness + web — LLM-free)
        run: |
          bun test evals/src/__tests__/
          bun test web/src/__tests__/

      - name: Pack sanity (contents + size)
        run: npm pack --dry-run

      - name: Resolve beta version (commit sha)
        if: github.ref != 'refs/heads/main'
        run: |
          BASE=$(node -p "require('./package.json').version.split('-')[0]")
          SHA=$(git rev-parse --short=7 HEAD)
          VER="${BASE}-beta.g${SHA}"
          echo "Publishing ${VER}"
          npm version "${VER}" --no-git-tag-version

      - name: Publish beta (non-main → tag beta)
        # No --provenance: the GitHub repo is private, and npm only verifies
        # provenance for PUBLIC source repos (publish fails with E422 otherwise).
        if: github.ref != 'refs/heads/main' && inputs.dry_run != true
        run: npm publish --tag beta --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish stable (main → tag latest)
        if: github.ref == 'refs/heads/main' && inputs.dry_run != true
        # Skip if this version is already on npm (e.g. a docs/cleanup merge with no
        # version bump) — npm rejects republishing a version, which would fail the run.
        run: |
          VER=$(node -p "require('./package.json').version")
          if npm view "@bondarewicz/dreamteam@${VER}" version >/dev/null 2>&1; then
            echo "v${VER} already on npm — skipping publish (no version bump)."
          else
            npm publish --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
