name: release

# Beta from any non-main branch (e.g. feat/distribution) → npm dist-tag `beta`.
# Stable from main → dist-tag `latest`. Both publish with OIDC provenance.
#
# GATE: the unit/integration suite (bun test) runs here — it's LLM-free and CI-safe.
# The BEHAVIORAL eval gate (`bun evals/src/cli.ts --trials 3`) is NOT run in CI: it
# needs Claude/Max auth that CI doesn't have, and ANTHROPIC_API_KEY would bill the API
# (the repo deliberately avoids that). Run it LOCALLY before triggering a release —
# see RELEASING.md.

on:
  push:
    branches: [main, feat/distribution]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Pack only, do not publish"
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write # OIDC provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Upgrade npm (OIDC trusted publishing needs npm >= 11.5)
        run: npm install -g npm@latest

      - name: Install
        run: bun install

      - name: Test gate (harness + web — LLM-free)
        run: |
          bun test evals/src/__tests__/
          bun test web/src/__tests__/

      - name: Pack sanity (contents + size)
        run: npm pack --dry-run

      - name: Resolve next sequential beta version
        if: github.ref != 'refs/heads/main'
        run: |
          BASE=$(node -p "require('./package.json').version.split('-')[0]")
          VERSIONS=$(npm view @bondarewicz/dreamteam versions --json 2>/dev/null || echo '[]')
          NEXT=$(BASE="$BASE" node -e '
            let v=[]; try { v=JSON.parse(process.argv[1]); } catch {}
            if (!Array.isArray(v)) v=[v];
            const pre=process.env.BASE+"-beta.";
            const ns=v.filter(x=>typeof x==="string"&&x.startsWith(pre))
                      .map(x=>parseInt(x.slice(pre.length),10))
                      .filter(Number.isInteger);
            console.log(ns.length?Math.max(...ns)+1:0);
          ' "$VERSIONS")
          echo "Publishing ${BASE}-beta.${NEXT}"
          npm version "${BASE}-beta.${NEXT}" --no-git-tag-version

      - name: Publish beta (non-main → tag beta)
        if: github.ref != 'refs/heads/main' && inputs.dry_run != true
        run: npm publish --tag beta --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish stable (main → tag latest)
        if: github.ref == 'refs/heads/main' && inputs.dry_run != true
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
