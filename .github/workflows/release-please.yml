name: release-please

# Versioning automation. release-please watches conventional commits on main
# (feat:, fix:, etc.) and maintains an open "Release PR" with the version bump
# + CHANGELOG. Merging that PR bumps package.json and creates the git tag +
# GitHub Release. The npm publish itself stays in release.yml (the configured
# OIDC trusted publisher) — when the version bump lands on main, release.yml
# sees a new version and publishes it. So: merge the Release PR → it ships.

# PARKED: manual-trigger only. release-please needs the repo setting
# "Allow GitHub Actions to create and approve pull requests" enabled to open
# its Release PR. That setting is intentionally OFF, so this does not run on
# push (it would only fail). To adopt later: enable that setting, then restore
# `on: push: branches: [main]`.
on:
  workflow_dispatch:

permissions:
  contents: write # create the release + tag
  pull-requests: write # maintain the Release PR

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
