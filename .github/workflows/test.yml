name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run eval tests
        run: bun test evals/src/__tests__/

      - name: Run web tests
        run: bun test web/src/__tests__/

      - name: Check site is in sync with agent specs
        run: bun scripts/build-site.ts --check

      - name: Unicode-safety scan (no smuggled/invisible codepoints)
        run: bun scripts/check-unicode-safety.ts
